<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowstone slab gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f5;--surface:#fff;--ink:#16191c;--muted:#656d75;--line:#dcdfe2;--accent:#1d5c63;--accent-ink:#fff;--ph:#e6e8ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--surface:#1b1e21;--ink:#eceef0;--muted:#9aa2a9;--line:#2c3135;--accent:#6cc3cb;--accent-ink:#0c1f22;--ph:#262a2e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px clamp(14px,3vw,36px) 12px}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.search{flex:1 1 280px;max-width:520px;position:relative}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search input:focus,.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.count{margin-left:auto;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
main{padding:20px clamp(14px,3vw,36px) 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block}
.card:hover{border-color:var(--accent)}
.ph{aspect-ratio:4/3;background:var(--ph);display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:10px 12px 12px}
.name{font-weight:600;font-size:15px;text-transform:capitalize}
.sub{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:8px;padding:0;max-width:min(1000px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog img{width:100%;max-height:72vh;object-fit:contain;background:var(--ph);display:block}
.dl{padding:14px 18px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dl h2{margin:0;font-size:20px;text-transform:capitalize}
.dl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.dl .sp{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style></head><body>

const th=(id,w)=>'https://drive.google.com/thumbnail?id='+id+'&sz=w'+w;
let sel=-1;
const $=id=>document.getElementById(id);
const chips=$('chips');
function chip(label,val,n){const b=document.createElement('button');b.className='chip';b.dataset.v=val;b.setAttribute('aria-pressed',val===sel);b.innerHTML=label+'<small>'+n+'</small>';b.onclick=()=>{sel=val;render()};return b}
function render(){
 const q=$('q').value.trim().toLowerCase(),op=$('onlyPhoto').checked;
 chips.innerHTML='';
 chips.append(chip('All',-1,D.length));
 SERIES.forEach((n,i)=>{const c=D.filter(d=>d.s===i).length;if(c)chips.append(chip(n,i,c))});
 chips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===sel));
 const list=D.filter(d=>(sel<0||d.s===sel)&&(!op||d.id)&&(!q||(d.name+' '+d.code+' '+d.slab).toLowerCase().includes(q)));
 $('count').textContent=list.length+' of '+D.length+' slabs';
 $('empty').hidden=list.length>0;
 const g=$('grid');g.innerHTML='';
 list.forEach(d=>{
  const b=document.createElement('button');b.className='card';
  const ph=document.createElement('div');ph.className='ph';
  if(d.id){const im=new Image();im.loading='lazy';im.alt=d.name;im.referrerPolicy='no-referrer';im.src=th(d.id,500);im.onerror=()=>{ph.textContent='Photo unavailable'};ph.append(im)}else ph.textContent='No photo yet';
  const m=document.createElement('div');m.className='meta';
  const n=document.createElement('div');n.className='name';n.textContent=d.name.toLowerCase();
  const s=document.createElement('div');s.className='sub';s.textContent=d.code+(d.slab?' – '+d.slab:'');
  m.append(n,s);b.append(ph,m);b.onclick=()=>open(d);g.append(b);
 });
}
function open(d){
 $('dname').textContent=d.name.toLowerCase();
 $('dsub').textContent=(SERIES[d.s]||'')+' – '+d.code+(d.slab?' – Slab '+d.slab:'');
 const im=$('dimg');im.alt=d.name;im.removeAttribute('src');
 if(d.id){im.src=th(d.id,1600);$('dopen').href='https://drive.google.com/file/d/'+d.id+'/view';$('dopen').hidden=false}else $('dopen').hidden=true;
 $('dlg').showModal();
}
$('dclose').onclick=()=>$('dlg').close();
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close()});
